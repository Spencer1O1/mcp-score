name: Integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MCP_SCORE_INTEGRATION: "1"

jobs:
  versions:
    # The MuseScore releases under test live in one file that the harness
    # reads too and that Renovate keeps current; see the file's comment.
    name: MuseScore versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.read.outputs.linux }}
      latest: ${{ steps.read.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: read
        run: |
          file=tests/integration/musescore-versions.json
          echo "linux=$(jq -c '[.oldest, .middle, .latest]' "$file")" >> "$GITHUB_OUTPUT"
          echo "latest=$(jq -r '.latest' "$file")" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux, MuseScore ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.linux) }}
    env:
      MUSESCORE_VERSION: ${{ matrix.version }}
      MUSESCORE_CACHE_DIR: ${{ github.workspace }}/.musescore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync

      - name: Install MuseScore runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool libegl1 libgl1 libopengl0 libxkbcommon0 libnss3 libpulse0 libasound2t64

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MUSESCORE_CACHE_DIR }}
          key: musescore-private-profile-${{ runner.os }}-${{ env.MUSESCORE_VERSION }}

      - name: Install MuseScore
        id: musescore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "executable=$(uv run scripts/musescore_harness.py install)" >> "$GITHUB_OUTPUT"

      - name: Render tests (headless export)
        env:
          MCP_SCORE_MUSESCORE_PATH: ${{ steps.musescore.outputs.executable }}
        # MuseScore needs an X display even for export.
        run: xvfb-run -a uv run pytest tests/integration/test_musescore_render.py -v

      - name: Snapshot ordinary user profile after headless rendering
        id: profile_snapshot
        run: uv run scripts/musescore_harness.py snapshot-normal-profile musescore-profile-before.json

      - name: Start MuseScore with the bridge plugin
        run: uv run scripts/musescore_harness.py start tests/integration/fixtures/fixture.musicxml

      - name: Bridge tests (live plugin)
        run: uv run pytest tests/integration/test_musescore_bridge.py tests/integration/test_musescore_dispatch.py -v

      - name: Start multi-staff passage fixture
        env:
          MUSESCORE_SELECTION_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/live-passage.musicxml

      - name: Multi-staff passage tests (live plugin)
        env:
          MCP_SCORE_PASSAGE_FIXTURE: "1"
          MCP_SCORE_PUBLIC_WORKFLOW_FIXTURE: "1"
          MCP_SCORE_SELECTION_FIXTURE: "1"
        run: uv run pytest tests/integration/test_musescore_passage.py tests/integration/test_musescore_selection.py tests/integration/test_public_mcp_workflow.py -v

      - name: Start guarded pitch fixture
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-pitch.musicxml

      - name: Guarded pitch tests (live plugin)
        env:
          MCP_SCORE_GUARDED_PITCH_FIXTURE: "1"
          MCP_SCORE_RECEIPT_FIXTURE: "1"
          MCP_SCORE_RECEIPT_RESTART_STATE: ${{ env.MUSESCORE_CACHE_DIR }}/receipt-ticket.json
        run: uv run pytest tests/integration/test_musescore_pitch.py tests/integration/test_musescore_receipts.py -v

      - name: Restart disposable pitch fixture for receipt session isolation
        env:
          MUSESCORE_PITCH_BATCH_TEST_SETUP: "1"
          MUSESCORE_CHORD_TONE_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-pitch.musicxml

      - name: Old receipt session is rejected after native restart
        env:
          MCP_SCORE_RECEIPT_RESTART_FIXTURE: "1"
          MCP_SCORE_PITCH_BATCH_FIXTURE: "1"
          MCP_SCORE_CHORD_TONE_FIXTURE: "1"
          MCP_SCORE_RECEIPT_RESTART_STATE: ${{ env.MUSESCORE_CACHE_DIR }}/receipt-ticket.json
        run: uv run pytest tests/integration/test_musescore_receipt_restart.py tests/integration/test_musescore_pitch_batch.py tests/integration/test_musescore_chord_tone.py -v

      - name: Start disposable guarded-duration fixture
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-duration.musicxml

      - name: Guarded duration tests (native support or explicit rejection)
        env:
          MCP_SCORE_GUARDED_DURATION_FIXTURE: "1"
        run: uv run pytest tests/integration/test_musescore_duration.py -v

      - name: Start disposable note-rest normal fixture
        env:
          MUSESCORE_NOTE_REST_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-note-rest.musicxml

      - name: Guarded note-rest normal mode and native cancellation tests
        env:
          MCP_SCORE_NOTE_REST_FIXTURE: "normal"
        run: uv run pytest tests/integration/test_musescore_note_rest.py -v

      - name: Start disposable note-rest concert fixture
        env:
          MUSESCORE_NOTE_REST_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-note-rest-concert.musicxml

      - name: Guarded note-rest concert mode and native cancellation tests
        env:
          MCP_SCORE_NOTE_REST_FIXTURE: "concert"
        run: uv run pytest tests/integration/test_musescore_note_rest.py -v

      - name: Start disposable staff-context fixture
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/staff-context.musicxml

      - name: Native staff-context tests (including older API partial results)
        env:
          MCP_SCORE_CONTEXT_FIXTURE: "1"
        run: uv run pytest tests/integration/test_musescore_context.py -v

      - name: Stop only owned MuseScore and display processes
        if: always()
        run: uv run scripts/musescore_harness.py stop

      - name: Collect private profile logs
        if: always()
        run: uv run scripts/musescore_harness.py collect-logs musescore-logs

      - name: Remove owned private profile after log collection
        if: always()
        run: uv run scripts/musescore_harness.py clean

      - name: Verify ordinary user profile was not changed
        if: always() && steps.profile_snapshot.outcome == 'success'
        run: uv run scripts/musescore_harness.py verify-normal-profile musescore-profile-before.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: musescore-logs-linux-${{ matrix.version }}
          path: musescore-logs/
          if-no-files-found: ignore

  windows:
    name: Windows, MuseScore ${{ needs.versions.outputs.latest }}
    needs: versions
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      MUSESCORE_VERSION: ${{ needs.versions.outputs.latest }}
      MUSESCORE_CACHE_DIR: ${{ github.workspace }}\.musescore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MUSESCORE_CACHE_DIR }}
          key: musescore-private-profile-${{ runner.os }}-${{ env.MUSESCORE_VERSION }}

      - name: Install MuseScore
        id: musescore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: echo "executable=$(uv run scripts/musescore_harness.py install)" >> "$GITHUB_OUTPUT"

      - name: Render tests (headless export)
        env:
          MCP_SCORE_MUSESCORE_PATH: ${{ steps.musescore.outputs.executable }}
        run: uv run pytest tests/integration/test_musescore_render.py -v

      - name: Snapshot ordinary user profile after headless rendering
        id: profile_snapshot
        run: uv run scripts/musescore_harness.py snapshot-normal-profile musescore-profile-before.json

      - name: Start MuseScore with the bridge plugin
        run: uv run scripts/musescore_harness.py start tests/integration/fixtures/fixture.musicxml

      - name: Bridge tests (live plugin)
        run: uv run pytest tests/integration/test_musescore_bridge.py tests/integration/test_musescore_dispatch.py -v

      - name: Start multi-staff passage fixture
        env:
          MUSESCORE_SELECTION_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/live-passage.musicxml

      - name: Multi-staff passage tests (live plugin)
        env:
          MCP_SCORE_PASSAGE_FIXTURE: "1"
          MCP_SCORE_PUBLIC_WORKFLOW_FIXTURE: "1"
          MCP_SCORE_SELECTION_FIXTURE: "1"
        run: uv run pytest tests/integration/test_musescore_passage.py tests/integration/test_musescore_selection.py tests/integration/test_public_mcp_workflow.py -v

      - name: Start guarded pitch fixture
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-pitch.musicxml

      - name: Guarded pitch tests (live plugin)
        env:
          MCP_SCORE_GUARDED_PITCH_FIXTURE: "1"
          MCP_SCORE_RECEIPT_FIXTURE: "1"
          MCP_SCORE_RECEIPT_RESTART_STATE: ${{ env.MUSESCORE_CACHE_DIR }}/receipt-ticket.json
        run: uv run pytest tests/integration/test_musescore_pitch.py tests/integration/test_musescore_receipts.py -v

      - name: Restart disposable pitch fixture for receipt session isolation
        env:
          MUSESCORE_PITCH_BATCH_TEST_SETUP: "1"
          MUSESCORE_CHORD_TONE_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-pitch.musicxml

      - name: Old receipt session is rejected after native restart
        env:
          MCP_SCORE_RECEIPT_RESTART_FIXTURE: "1"
          MCP_SCORE_PITCH_BATCH_FIXTURE: "1"
          MCP_SCORE_CHORD_TONE_FIXTURE: "1"
          MCP_SCORE_RECEIPT_RESTART_STATE: ${{ env.MUSESCORE_CACHE_DIR }}/receipt-ticket.json
        run: uv run pytest tests/integration/test_musescore_receipt_restart.py tests/integration/test_musescore_pitch_batch.py tests/integration/test_musescore_chord_tone.py -v

      - name: Start disposable guarded-duration fixture
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-duration.musicxml

      - name: Guarded duration tests (native support or explicit rejection)
        env:
          MCP_SCORE_GUARDED_DURATION_FIXTURE: "1"
        run: uv run pytest tests/integration/test_musescore_duration.py -v

      - name: Start disposable note-rest normal fixture
        env:
          MUSESCORE_NOTE_REST_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-note-rest.musicxml

      - name: Guarded note-rest normal mode and native cancellation tests
        env:
          MCP_SCORE_NOTE_REST_FIXTURE: "normal"
        run: uv run pytest tests/integration/test_musescore_note_rest.py -v

      - name: Start disposable note-rest concert fixture
        env:
          MUSESCORE_NOTE_REST_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-note-rest-concert.musicxml

      - name: Guarded note-rest concert mode and native cancellation tests
        env:
          MCP_SCORE_NOTE_REST_FIXTURE: "concert"
        run: uv run pytest tests/integration/test_musescore_note_rest.py -v

      - name: Start disposable staff-context fixture
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/staff-context.musicxml

      - name: Native staff-context tests (including older API partial results)
        env:
          MCP_SCORE_CONTEXT_FIXTURE: "1"
        run: uv run pytest tests/integration/test_musescore_context.py -v

      - name: Stop only owned MuseScore and display processes
        if: always()
        run: uv run scripts/musescore_harness.py stop

      - name: Collect private profile logs
        if: always()
        run: uv run scripts/musescore_harness.py collect-logs musescore-logs

      - name: Remove owned private profile after log collection
        if: always()
        run: uv run scripts/musescore_harness.py clean

      - name: Verify ordinary user profile was not changed
        if: always() && steps.profile_snapshot.outcome == 'success'
        run: uv run scripts/musescore_harness.py verify-normal-profile musescore-profile-before.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: musescore-logs-windows
          path: musescore-logs/
          if-no-files-found: ignore

  macos:
    name: macOS, MuseScore ${{ needs.versions.outputs.latest }}
    needs: versions
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      MUSESCORE_VERSION: ${{ needs.versions.outputs.latest }}
      MUSESCORE_CACHE_DIR: ${{ github.workspace }}/.musescore
      # Native CFPreferences cannot be proven private per-process on this OS.
      # This explicit mode uses the disposable GitHub-hosted runner account.
      MUSESCORE_MACOS_RUNNER_ISOLATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MUSESCORE_CACHE_DIR }}
          key: musescore-private-profile-${{ runner.os }}-${{ env.MUSESCORE_VERSION }}

      - name: Install MuseScore
        id: musescore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "executable=$(uv run scripts/musescore_harness.py install)" >> "$GITHUB_OUTPUT"

      - name: Render tests (headless export)
        env:
          MCP_SCORE_MUSESCORE_PATH: ${{ steps.musescore.outputs.executable }}
        run: uv run pytest tests/integration/test_musescore_render.py -v

      - name: Record disposable runner account profile before live tests
        id: profile_snapshot
        run: uv run scripts/musescore_harness.py snapshot-normal-profile musescore-profile-before.json

      - name: Start MuseScore with the bridge plugin
        run: uv run scripts/musescore_harness.py start tests/integration/fixtures/fixture.musicxml

      - name: Bridge tests (live plugin)
        run: uv run pytest tests/integration/test_musescore_bridge.py tests/integration/test_musescore_dispatch.py -v

      - name: Start multi-staff passage fixture
        env:
          MUSESCORE_SELECTION_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/live-passage.musicxml

      - name: Multi-staff passage tests (live plugin)
        env:
          MCP_SCORE_PASSAGE_FIXTURE: "1"
          MCP_SCORE_PUBLIC_WORKFLOW_FIXTURE: "1"
          MCP_SCORE_SELECTION_FIXTURE: "1"
        run: uv run pytest tests/integration/test_musescore_passage.py tests/integration/test_musescore_selection.py tests/integration/test_public_mcp_workflow.py -v

      - name: Start guarded pitch fixture
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-pitch.musicxml

      - name: Guarded pitch tests (live plugin)
        env:
          MCP_SCORE_GUARDED_PITCH_FIXTURE: "1"
          MCP_SCORE_RECEIPT_FIXTURE: "1"
          MCP_SCORE_RECEIPT_RESTART_STATE: ${{ env.MUSESCORE_CACHE_DIR }}/receipt-ticket.json
        run: uv run pytest tests/integration/test_musescore_pitch.py tests/integration/test_musescore_receipts.py -v

      - name: Restart disposable pitch fixture for receipt session isolation
        env:
          MUSESCORE_PITCH_BATCH_TEST_SETUP: "1"
          MUSESCORE_CHORD_TONE_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-pitch.musicxml

      - name: Old receipt session is rejected after native restart
        env:
          MCP_SCORE_RECEIPT_RESTART_FIXTURE: "1"
          MCP_SCORE_PITCH_BATCH_FIXTURE: "1"
          MCP_SCORE_CHORD_TONE_FIXTURE: "1"
          MCP_SCORE_RECEIPT_RESTART_STATE: ${{ env.MUSESCORE_CACHE_DIR }}/receipt-ticket.json
        run: uv run pytest tests/integration/test_musescore_receipt_restart.py tests/integration/test_musescore_pitch_batch.py tests/integration/test_musescore_chord_tone.py -v

      - name: Start disposable guarded-duration fixture
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-duration.musicxml

      - name: Guarded duration tests (native support or explicit rejection)
        env:
          MCP_SCORE_GUARDED_DURATION_FIXTURE: "1"
        run: uv run pytest tests/integration/test_musescore_duration.py -v

      - name: Start disposable note-rest normal fixture
        env:
          MUSESCORE_NOTE_REST_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-note-rest.musicxml

      - name: Guarded note-rest normal mode and native cancellation tests
        env:
          MCP_SCORE_NOTE_REST_FIXTURE: "normal"
        run: uv run pytest tests/integration/test_musescore_note_rest.py -v

      - name: Start disposable note-rest concert fixture
        env:
          MUSESCORE_NOTE_REST_TEST_SETUP: "1"
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/guarded-note-rest-concert.musicxml

      - name: Guarded note-rest concert mode and native cancellation tests
        env:
          MCP_SCORE_NOTE_REST_FIXTURE: "concert"
        run: uv run pytest tests/integration/test_musescore_note_rest.py -v

      - name: Start disposable staff-context fixture
        run: |
          uv run scripts/musescore_harness.py stop
          uv run scripts/musescore_harness.py start tests/integration/fixtures/staff-context.musicxml

      - name: Native staff-context tests (including older API partial results)
        env:
          MCP_SCORE_CONTEXT_FIXTURE: "1"
        run: uv run pytest tests/integration/test_musescore_context.py -v

      - name: Stop only owned MuseScore and display processes
        if: always()
        run: uv run scripts/musescore_harness.py stop

      - name: Collect owned artifact and disposable account logs
        if: always()
        run: uv run scripts/musescore_harness.py collect-logs musescore-logs

      - name: Remove owned artifacts after log collection
        if: always()
        run: uv run scripts/musescore_harness.py clean

      - name: Audit explicit disposable runner account boundary after cleanup
        if: always() && steps.profile_snapshot.outcome == 'success'
        run: uv run scripts/musescore_harness.py verify-runner-account-boundary musescore-profile-before.json musescore-logs/runner-account-boundary.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: musescore-logs-macos
          path: musescore-logs/
          if-no-files-found: ignore
